[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12", "nanobind==2.9"]
build-backend = "scikit_build_core.build"

[project]
name = "loom-dataflow"
dynamic = ["version"]
description = "Loom MLIR dataflow pipeline with pybind11 bindings"
requires-python = ">=3.10,<3.11"
dependencies = []

[dependency-groups]
dev = [
    "lit",
]

[tool.scikit-build]
cmake.build-type = "Release"
# Persistent build tree so reinstalls only recompile changed sources.
build-dir = "build-py/{wheel_tag}"
# Let cmake install() rules handle all packaging — __init__.py and
# _loom_pipeline.so are both installed into the loom_pipeline/ directory.
wheel.packages = []

[tool.scikit-build.cmake.define]
MLIR_DIR = {env = "MLIR_DIR", default = "/opt/llvm-mlir/lib/cmake/mlir"}
ADLDialect_DIR = {env = "ADLDialect_DIR"}
LLVM_USE_LINKER = "lld"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = "(?P<value>.+)"

# Rebuild the extension on `uv sync` / `uv run` whenever its sources change,
# not only when VERSION does.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "VERSION" },
    { file = "CMakeLists.txt" },
    { file = "lib/**/*.cpp" },
    { file = "lib/**/*.h" },
    { file = "lib/**/*.td" },
    { file = "lib/**/*.in" },
    { file = "lib/**/*.py" },
    { file = "lib/**/CMakeLists.txt" },
]
